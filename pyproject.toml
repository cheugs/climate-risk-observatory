[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cro"
version = "0.1.0"
description = "Climate Risk and Human Development Observatory (DS01)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15.0",
  "geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "rasterio>=1.3",
  "scipy>=1.12", "statsmodels>=0.14", "libpysal>=4.10", "esda>=2.6", "mapclassify>=2.6",
  "sqlalchemy>=2.0", "geoalchemy2>=0.15", "psycopg2-binary>=2.9",
  "plotly>=5.22", "kaleido>=0.2.1", "dash>=2.17", "dash-bootstrap-components>=1.6",
  "matplotlib>=3.8", "markdown>=3.5", "tabulate>=0.9",
  "requests>=2.32", "PyYAML>=6.0", "tqdm>=4.66", "python-dotenv>=1.0", "openpyxl>=3.1",
]

[project.scripts]
cro = "cro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
